name: Bootstrap canonical v1.0 payload

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize and verify canonical payload
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip, hashlib, pathlib, urllib.request
          root = pathlib.Path('.')
          encoded = (root / '.bootstrap/bootloader.gz.b64').read_text()
          boot = gzip.decompress(base64.b64decode(encoded))
          expected_boot = '1cedbfa9ecc4aa08145f1c24e65f1991a9f3fdab6d17d89e2bb412ad9bb42e13'
          got = hashlib.sha256(boot).hexdigest()
          if got != expected_boot:
              raise SystemExit(f'Bootloader hash mismatch: {got} != {expected_boot}')
          (root / 'YoganandaChat_v1.0.json').write_bytes(boot)

          downloads = [
              ('https://www.gutenberg.org/cache/epub/7452/pg7452.txt', 'Autobiography_of_a_Yogi_1946_Public_Domain.txt', '1299580d5017a3b63194d739394ffec7a63145e6789c04cfc95be3241a0d7d79'),
              ('https://www.gnu.org/licenses/gpl-3.0.txt', 'LICENSE', '3972dc9744f6499f0f9b2dbf76696f2ae7ad8af9b23dde66d6af86c9dfb36986'),
          ]
          for url, name, expected in downloads:
              data = urllib.request.urlopen(url, timeout=90).read()
              got = hashlib.sha256(data).hexdigest()
              if got != expected:
                  raise SystemExit(f'Hash mismatch for {name}: {got} != {expected}')
              (root / name).write_bytes(data)
          PY
      - name: Commit canonical payload
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add YoganandaChat_v1.0.json Autobiography_of_a_Yogi_1946_Public_Domain.txt LICENSE
          git commit -m "release: add canonical YoganandaChat v1.0 payload"
          git push
